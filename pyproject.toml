[project]
name = "milikara"
version = "1.2.0"
description = "MiliKara: Japanese karaoke videos from a song and its lyrics (mora-level alignment, furigana, burned-in subtitles)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pykakasi>=2.3,<3",
    # Japanese word segmentation and context-aware readings (MeCab + UniDic lite);
    # without them the rules fall back to character classes + pykakasi
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "pypinyin>=0.51",
    # karaoke subtitles: text measurement for ASS layout
    "pillow>=10",
    "fonttools>=4.40",
]

[project.optional-dependencies]
# CTC acoustic backend (MMS / wav2vec2 forced aligner weights)
ml = [
    "torch>=2.2",
    "transformers>=4.40,<5",
]
# optional vocal separation (BS-RoFormer / MelBand RoFormer presets)
separation = [
    # pinned: 0.47 runs RoFormer models ~2.5x slower on Apple MPS than 0.30.2
    "audio-separator[cpu]>=0.30.2,<0.31",
    "audioread>=3.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
milikara = "kara_align.cli:main"
kirakara = "kara_align.cli:main"  # the name before v1.1.0: still works, says it was renamed
kara-align = "kara_align.cli:main"  # the earlier name, kept working

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kara_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: requires internet access",
    "ml: requires torch/transformers and model weights",
]
addopts = "-m 'not network and not ml' --import-mode=importlib"
